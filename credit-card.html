<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Payment - Chen's Jewelry</title>
<link rel="stylesheet" href="style.css">

<style>
.card-page{
  max-width:1100px;
  margin:120px auto 60px;
  padding:30px;
}

.card-layout{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:30px;
}

.card-info,
.card-form{
  background:white;
  padding:30px;
  border-radius:28px;
  box-shadow:0 12px 35px rgba(0,0,0,.10);
  border:1px solid #ffe3f0;
}

.card-info{
  background:linear-gradient(135deg,#fff0f7,#ffffff);
}

.card-icon{
  font-size:55px;
  margin-bottom:15px;
}

.card-info h1,
.card-form h2{
  color:#8b285c;
  margin-bottom:15px;
}

.card-info p{
  color:#666;
  line-height:1.7;
}

.card-form label{
  display:block;
  font-weight:bold;
  margin:15px 0 6px;
}

.card-form input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:15px;
}

.card-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.submit-card{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#d84f93,#8b285c);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.submit-card:hover{
  transform:translateY(-2px);
}

.back-link{
  display:inline-block;
  margin-bottom:20px;
  color:#8b285c;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:850px){
  .card-layout{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">💎 Chen's Jewelry</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="product.html">Products</a>
    <a href="promo.html">Promo</a>
  </nav>
</header>

<div class="card-page">

<a href="order.html" class="back-link">← Back to Order Summary</a>

<div class="card-layout">

<div class="card-info">
  <div class="card-icon">💳</div>
  <h1>Credit Card Payment</h1>
  <p>
    Enter your credit card information to continue your order.
    Your payment details are used only for this school project checkout simulation.
  </p>
</div>

<div class="card-form">
  <h2>Card Information</h2>

  <label>Cardholder Name</label>
  <input id="cardName" placeholder="Enter cardholder name">

  <label>Card Number</label>
  <input id="cardNumber" maxlength="16" placeholder="16-digit card number">

  <div class="card-row">
    <div>
      <label>Expiry Date</label>
      <input id="expiryDate" maxlength="5" placeholder="MM/YY">
    </div>

    <div>
      <label>CVV</label>
      <input id="cvv" maxlength="3" placeholder="123">
    </div>
  </div>

  <button class="submit-card" onclick="submitCreditCard()">
    Submit Credit Card Payment
  </button>
</div>

</div>
</div>

<script>

function submitCreditCard(){

  const cardName = document.getElementById("cardName").value.trim();
  const cardNumber = document.getElementById("cardNumber").value.trim();
  const expiryDate = document.getElementById("expiryDate").value.trim();
  const cvv = document.getElementById("cvv").value.trim();

  if(!cardName || !cardNumber || !expiryDate || !cvv){
    alert("Please complete all credit card information.");
    return;
  }

  if(!/^\d{16}$/.test(cardNumber)){
    alert("Card number must be exactly 16 digits.");
    return;
  }

  if(!/^\d{2}\/\d{2}$/.test(expiryDate)){
    alert("Expiry date must be in MM/YY format.");
    return;
  }

  if(!/^\d{3}$/.test(cvv)){
    alert("CVV must be exactly 3 digits.");
    return;
  }

  localStorage.setItem("cardVerified","true");
  localStorage.setItem("paymentMethod","Credit Card");

  alert("💳 Credit card information submitted successfully!");

  window.location.href = "order.html";
}
</script>

</body>
</html>
