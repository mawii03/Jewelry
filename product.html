<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - Chen's Jewelry Official Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">💎 Chen's Jewelry</div>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="poster.html">Posters</a>
      <a href="product.html">Products</a>
      <a href="promo.html">Promo</a>
      <a href="about.html">About Us</a>
      
    </nav>
    <div id="userArea">
  <button class="cart-btn" onclick="openLogin()">
    🔐 Login
  </button>
</div>
  </header>
  <div class="page-header-space"></div>
  <section class="section product-page-header">
    <h1>Our Jewelry Products</h1>
    <p class="subtitle"></p>
  </section>

  <section id="products" class="section product-only-section">
    <div class="products" id="productList"></div>
  </section>

  <button class="chat-button" onclick="toggleChat()">💬 Chat Support</button>
  <div id="chatBox" class="chat-box">
    <div class="chat-header">Chen's Jewelry Chat Support <button onclick="toggleChat()">×</button></div>
    <div id="chatMessages">

    <div class="bot-message">
    Hello! Welcome to Chen's Jewelry 💎
    <br><br>

    Choose below:
    </div>
    <div class="quick-options">
    <button onclick="quickChat('Track My Order')">
    📦 Track My Order
    </button>
    <button onclick="quickChat('Track Order')">
    🚚 Track Order
    </button>
    <button onclick="quickChat('Current Promos')">
    🎁 Current Promos
    </button>
    <button onclick="quickChat('Student Discount')">
    🎓 Student Discount
    </button>
    <button onclick="quickChat('Contact Support')">
    💬 Contact Support
    </button>
    </div>

    </div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <aside id="cartPanel" class="cart-panel">
    <button class="close" onclick="toggleCart()">×</button>
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <button class="checkout"onclick="goToOrderPage()">Place Order</button>
  </aside>

<div id="loginPopup" class="login-popup">
  <div class="login-box">

    <button class="login-close" onclick="closeLogin()">×</button>

    <h2 id="loginTitle">Login</h2>

    <input id="loginName" placeholder="Full Name">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="checkout" onclick="loginUser()">
      Login
    </button>

    <p>
      Don't have an account?
      <span onclick="showRegister()">Register</span>
    </p>

  </div>
</div>

  <footer>
    <p>© 2026 Chen's Jewelry Official Store. All rights reserved.</p>
    <p>Contact Number: 0923456438</p>
  </footer>
  <div id="productPopup"
class="product-popup">

<div class="popup-box">

<button
class="popup-close"
onclick="closeProduct()">

×

</button>

<img id="viewImage">

<h2 id="viewName"></h2>

<p id="viewPrice"></p>

<p id="viewDescription"></p>

<button
id="popupAddCart"
class="popup-add-btn">

Add To Cart

</button>

</div>

</div>
  <script src="script.js"></script>
</body>
</html>
