<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Chen's Jewelry</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="logo">💎 Chen's Jewelry</div>

  <nav>
    <a href="index.html#home">Home</a>
    <a href="poster.html">Posters</a>
    <a href="product.html">Products</a>
    <a href="promo.html">Promo</a>
    <a href="about.html">About Us</a>
  </nav>

  <div id="userArea">
  <button class="cart-btn" onclick="openLogin()">
    🔐 Login
  </button>
</div>

</header>

<section class="feedback-page">

  <!-- BIG TITLE AT TOP -->
  <div class="feedback-title">
    <h1>⭐ Customer Reviews</h1>
    <p>Share your experience with Chen's Jewelry</p>
    <!--
     <button onclick="clearAllReviews()" class="delete-review-btn">
        🗑 Delete All Reviews
    </button>
    -->
  </div>

  <!-- 3 COLUMNS -->
  <div class="feedback-three-column">

    <!-- LEFT -->
    <div class="feedback-box">
  <h2>✍️ Leave Review</h2>

  <form id="feedbackForm">
    <label>Name</label>
    <input type="text" id="customerName" required>

    <label>Product</label>
    <input type="text" id="productPurchased" required>

    <label>Rating</label>
    <select id="rating" required>
      <option value="">Select Rating</option>
      <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ Excellent</option>
      <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ Good</option>
      <option value="⭐⭐⭐">⭐⭐⭐ Average</option>
      <option value="⭐⭐">⭐⭐ Poor</option>
      <option value="⭐">⭐ Very Poor</option>
    </select>

    <label>Comment</label>
    <textarea id="comment" rows="5" required></textarea>

    <button type="submit">Submit Review</button>
  </form>
</div>

    <!-- MIDDLE -->
    <div class="reviews-column">
      <div id="reviewsListLeft"></div>
    </div>

    <!-- RIGHT -->
    <div class="reviews-column">
      <div id="reviewsListRight"></div>
    </div>

  </div>

</section>

<aside id="cartPanel" class="cart-panel">

  <button class="close" onclick="toggleCart()">×</button>

  <h2>Your Cart</h2>

  <div id="cartItems"></div>

  <button class="checkout" onclick="goToOrderPage()">
    Place Order
  </button>

</aside>

<div id="loginPopup" class="login-popup">
  <div class="login-box">

    <button class="login-close" onclick="closeLogin()">×</button>

    <h2 id="loginTitle">Login</h2>

    <input id="loginName" placeholder="Full Name">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="checkout" onclick="loginUser()">
      Login
    </button>

    <p>
      Don't have an account?
      <span onclick="showRegister()">Register</span>
    </p>

  </div>
</div>

<footer>
    <p>© 2026 Chen's Jewelry Official Store. All rights reserved.</p>
    <p>Contact Number: 0923456438</p>
  </footer>

<script src="script.js"></script>

</body>
</html>
