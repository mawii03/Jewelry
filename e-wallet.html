<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Wallet Payment - Chen's Jewelry</title>
<link rel="stylesheet" href="style.css">

<style>
.wallet-page{
  max-width:1100px;
  margin:120px auto 60px;
  padding:30px;
}

.wallet-layout{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:30px;
}

.wallet-info,
.wallet-form{
  background:white;
  padding:30px;
  border-radius:28px;
  box-shadow:0 12px 35px rgba(0,0,0,.10);
  border:1px solid #ffe3f0;
}

.wallet-info{
  background:linear-gradient(135deg,#fff0f7,#ffffff);
}

.wallet-icon{
  font-size:55px;
  margin-bottom:15px;
}

.wallet-info h1,
.wallet-form h2{
  color:#8b285c;
  margin-bottom:15px;
}

.wallet-info p{
  color:#666;
  line-height:1.7;
}

.wallet-form label{
  display:block;
  font-weight:bold;
  margin:15px 0 6px;
}

.wallet-form input,
.wallet-form select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:15px;
}

.submit-wallet{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#d84f93,#8b285c);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.submit-wallet:hover{
  transform:translateY(-2px);
}

.back-link{
  display:inline-block;
  margin-bottom:20px;
  color:#8b285c;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:850px){
  .wallet-layout{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">💎 Chen's Jewelry</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="product.html">Products</a>
    <a href="promo.html">Promo</a>
  </nav>
</header>

<div class="wallet-page">

<a href="order.html" class="back-link">← Back to Order Summary</a>

<div class="wallet-layout">

<div class="wallet-info">
  <div class="wallet-icon">📱</div>
  <h1>E-Wallet Payment</h1>
  <p>
    Complete your e-wallet payment information below.
    This page simulates a secure digital wallet checkout for your store.
  </p>
</div>

<div class="wallet-form">
  <h2>E-Wallet Information</h2>

  <label>Select E-Wallet</label>
  <select id="walletType">
    <option value="">Choose E-Wallet</option>
    <option value="LINE Pay">LINE Pay</option>
    <option value="Apple Pay">Apple Pay</option>
    <option value="Google Pay">Google Pay</option>
    <option value="JKoPay">JKoPay</option>
    <option value="GCash">GCash</option>
  </select>

  <label>Account Name</label>
  <input id="walletName" placeholder="Enter account name">

  <label>Phone Number</label>
 <input
id="walletPhone"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="10-digit phone number">
  <label>Transaction Reference Number</label>
  <input id="walletReference" placeholder="Enter transaction reference">

  <button class="submit-wallet" onclick="submitEWallet()">
    Submit E-Wallet Payment
  </button>
</div>

</div>
</div>

<script>
function submitEWallet(){

  const walletType = document.getElementById("walletType").value;
  const walletName = document.getElementById("walletName").value.trim();
  const walletPhone = document.getElementById("walletPhone").value.trim();
  const walletReference = document.getElementById("walletReference").value.trim();

  if(!walletType || !walletName || !walletPhone || !walletReference){
    alert("Please complete all e-wallet information.");
    return;
  }

  const cleanPhone = walletPhone.replace(/\D/g,'');

if(cleanPhone.length !== 10){
  alert("Phone number must be exactly 10 digits.");
  return;
}

  localStorage.setItem("walletVerified","true");
  localStorage.setItem("paymentMethod","E-Wallet");

  alert("📱 E-Wallet payment submitted successfully!");

  window.location.href = "order.html";
}
</script>

</body>
</html>
