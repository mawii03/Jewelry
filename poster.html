<!-- POPUP -->

<div id="productPopup"
class="product-popup">

<div class="popup-box">

<button
class="popup-close"
onclick="closePosterProduct()">

×

</button>

<img
id="popupImage"
src="">

<h2 id="popupName"></h2>

<p id="popupPrice"></p>

<button
id="popupAddCart"
class="popup-add-btn">

Add to Cart

</button>
<br><br>

id="popupViewProduct"
href="#"
class="popup-btn">

<!-- CART PANEL -->

<aside id="cartPanel" class="cart-panel">

    <button class="checkout" onclick="goToOrderPage()">Place Order</button>
  </aside>

  <div id="loginPopup" class="login-popup">

    <button class="login-close" onclick="closeLogin()">×</button>

    <h2 id="loginTitle">Login</h2>

    <input id="loginName" placeholder="Full Name">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="checkout" onclick="loginUser()">
      Login
